<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add member</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.seg{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));background:#E4E6DF;border-radius:12px;padding:4px}
.sb{height:40px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:600;font-size:14px;color:#3B4A41}
.on{background:#fff;color:#1C2620}
</style>
</helmet>
<div style="width:390px;height:1240px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="SettingsTeam.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;flex:none;margin-right:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg></span>
    <h1 style="margin:0;font-size:20px;font-weight:700">Add member</h1>
  </div>
  <div style="padding:8px 20px;display:flex;flex-direction:column;gap:16px">
    <div><span class="lab">Role</span><div class="seg"><button class="sb">Owner</button><button class="sb on">Worker</button></div></div>
    <div><label class="lab" for="nm">Name *</label><input class="inp" id="nm" value="Murugan"></div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <div><label class="lab" for="dob">Date of birth</label><input class="inp" id="dob" type="date"></div>
      <div><label class="lab" for="sx">Sex</label><select class="inp" id="sx"><option>Male</option><option>Female</option></select></div>
    </div>
    <div><label class="lab" for="ph">Phone</label><input class="inp" id="ph" type="tel" placeholder="+91"></div>
    <div><label class="lab" for="em">Email (used to sign in)</label><input class="inp" id="em" type="email" placeholder="worker@example.com"></div>
    <label style="display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid #DDE1D9;border-radius:12px;padding:14px;font-size:15px">
      <input type="checkbox" checked style="width:20px;height:20px;margin-top:1px;accent-color:#1F5C3A">
      <span><b style="font-weight:600">Can sign in to the app</b><br><span style="font-size:13px;color:#56655B">Set a password below and share it with them yourself. Leave off for workers whose records you enter yourself.</span></span>
    </label>
    <div><label class="lab" for="pw">Password *</label>
      <div style="position:relative">
        <input class="inp" id="pw" type="password" placeholder="At least 8 characters" style="padding-right:52px">
        <button type="button" aria-label="Show password" style="position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#56655B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <div><label class="lab" for="pw2">Confirm password *</label><input class="inp" id="pw2" type="password" placeholder="Re-enter password"></div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <div><label class="lab" for="wt">Wage type</label><select class="inp" id="wt"><option>Daily</option><option>Monthly</option><option>None</option></select></div>
      <div><label class="lab" for="wr">Wage (₹)</label><input class="inp" id="wr" inputmode="decimal" value="500"></div>
    </div>
    <div><label class="lab" for="jd">Joined on</label><input class="inp" id="jd" type="date"></div>
  </div>
  <div style="margin-top:auto;padding:16px 20px 10px;border-top:1px solid #E1E4DC;display:flex;gap:12px">
    <button style="height:50px;flex:1;border-radius:12px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-weight:600;font-size:15px;color:#A3271B">Deactivate</button>
    <button style="height:50px;flex:2;border-radius:12px;border:0;background:#1F5C3A;color:#fff;font:inherit;font-weight:600;font-size:16px">Save</button>
  </div>
  <div style="text-align:center;font-size:12px;color:#56655B;padding:0 16px 14px">© 2026 Dairy Farm. All rights reserved.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
