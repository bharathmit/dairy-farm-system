<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.btn{height:50px;border-radius:12px;border:0;font:inherit;font-weight:600;font-size:16px;background:#1F5C3A;color:#fff;width:100%}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F4F3EE;display:flex;flex-direction:column;box-sizing:border-box;padding:16px 24px 20px">
  <a href="Main.dc.html" aria-label="Back to login" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-10px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
    <div style="width:44px;height:44px;border-radius:12px;background:#1F5C3A;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg>
    </div>
    <div style="font-size:20px;font-weight:700">Dairy Farm</div>
  </div>
  <h1 style="margin:28px 0 6px;font-size:26px;font-weight:700">Reset password</h1>
  <p style="margin:0 0 28px;color:#56655B;font-size:15px;line-height:1.45">Enter the email you sign in with. We'll send a link to set a new password.</p>
  <label class="lab" for="em">Email</label>
  <input class="inp" id="em" type="email" placeholder="you@example.com">
  <button class="btn" style="margin-top:20px">Send reset link</button>

  <div style="margin-top:28px;background:#E7F0E9;border-radius:12px;padding:14px 16px;display:flex;gap:12px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5C3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M20 6L9 17l-5-5"/></svg>
    <div style="font-size:14px;line-height:1.45;color:#1C3A28"><b>Check your inbox.</b><br>If an account exists for that email, a reset link is on its way. It opens <a href="UpdatePassword.dc.html" style="font-weight:600">Set a new password</a> and expires in 1 hour.</div>
  </div>
  <a href="Main.dc.html" style="margin-top:auto;align-self:center;font-size:15px;font-weight:600;min-height:44px;display:flex;align-items:center;gap:6px;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back to sign in</a>
  <div style="text-align:center;font-size:12px;color:#56655B;padding:10px 16px 0">© 2026 Dairy Farm. All rights reserved.</div>
</div>
