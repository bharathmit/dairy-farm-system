<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add or edit animal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#56655B;margin:22px 0 10px}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.seg{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));background:#E4E6DF;border-radius:12px;padding:4px}
.sb{height:40px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:600;font-size:14px;color:#3B4A41}
.sbon{background:#fff;color:#1C2620}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
.hint{font-size:12px;color:#56655B;margin-top:5px}
</style>
</helmet>
<div style="width:390px;height:1480px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid #E1E4DC">
    <a href="AnimalList.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;flex:none;margin-right:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg></span>
    <h1 style="margin:0;font-size:20px;font-weight:700;flex:1">Add animal</h1>
    <a href="AnimalProfile.dc.html" style="padding:0 12px;height:44px;display:flex;align-items:center;font-weight:700;text-decoration:none">Save</a>
  </div>
  <div style="padding:0 20px 24px">
    <div class="sec">Photos</div>
    <div style="display:flex;gap:10px">
      <button aria-label="Add photo" style="width:88px;height:88px;border-radius:12px;border:1px dashed #A9B3A6;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-size:12px;color:#3B4A41"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5C3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add</button>
      <div style="width:88px;height:88px;border-radius:12px;background:#E4E6DF"></div>
      <div style="width:88px;height:88px;border-radius:12px;background:#E4E6DF"></div>
    </div>
    <div class="hint">Up to 3 photos</div>

    <div class="sec">Identity</div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div><label class="lab" for="tg">Ear tag number *</label><div style="display:flex;gap:8px"><input class="inp" id="tg" value="VD-021"><button aria-label="Scan tag" style="width:48px;height:48px;flex:none;border-radius:10px;border:1px solid #C9D0C6;background:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></button></div></div>
      <div class="two"><div><label class="lab" for="nm">Name</label><input class="inp" id="nm" placeholder="Optional"></div><div><label class="lab" for="ni">National ID</label><input class="inp" id="ni" placeholder="Optional"></div></div>
    </div>

    <div class="sec">Basics</div>
    <span class="lab">Species *</span>
    <div class="chips"><button class="chip on">Cow</button><button class="chip">Buffalo</button><button class="chip">Goat</button><button class="chip">Sheep</button><button class="chip">Pig</button><button class="chip">Poultry</button></div>
    <div class="hint">Can't be changed after saving.</div>
    <span class="lab" style="margin-top:14px">Sex *</span>
    <div class="seg"><button class="sb sbon">Female</button><button class="sb">Male</button></div>
    <span class="lab" style="margin-top:14px">Breed</span>
    <div class="chips"><button class="chip on">HF</button><button class="chip">Jersey</button><button class="chip">HF × Jersey</button><button class="chip">Sahiwal</button><button class="chip">Gir</button><button class="chip">Other…</button></div>
    <div class="two" style="margin-top:14px">
      <div><label class="lab" for="ct">Category *</label><select class="inp" id="ct"><option>Milking</option><option>Dry</option><option>Heifer</option><option>Calf</option><option>Bull</option></select></div>
      <div><label class="lab" for="cl">Colour</label><input class="inp" id="cl" placeholder="Black &amp; white"></div>
    </div>
    <div style="margin-top:14px"><label class="lab" for="gr">Group</label><select class="inp" id="gr"><option>Milking shed A</option><option>No group</option></select></div>

    <div class="sec">Birth &amp; source</div>
    <div class="seg"><button class="sb">Born on farm</button><button class="sb sbon">Purchased</button></div>
    <div class="two" style="margin-top:14px">
      <div><label class="lab" for="db">Date of birth</label><input class="inp" id="db" type="date"><div class="hint">Required if born on farm</div></div>
      <div><label class="lab" for="bw">Birth weight (kg)</label><input class="inp" id="bw" inputmode="decimal"></div>
    </div>
    <div class="two" style="margin-top:14px">
      <div><label class="lab" for="ad">Purchase date</label><input class="inp" id="ad" type="date"></div>
      <div><label class="lab" for="pp">Purchase price (₹)</label><input class="inp" id="pp" inputmode="decimal" placeholder="65,000"></div>
    </div>
    <div class="two" style="margin-top:14px">
      <div><label class="lab" for="lc">Last calving date</label><input class="inp" id="lc" type="date"><div class="hint">Milking / dry cows</div></div>
      <div><label class="lab" for="cw">Current weight (kg)</label><input class="inp" id="cw" inputmode="decimal"></div>
    </div>

    <div class="sec">Parents</div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div><label class="lab" for="dm">Dam (mother)</label><input class="inp" id="dm" placeholder="Pick from herd or type tag"></div>
      <div><label class="lab" for="sr">Sire (father)</label><input class="inp" id="sr" placeholder="Pick bull, or AI bull name / code"></div>
    </div>

    <div class="sec">Notes</div>
    <textarea aria-label="Notes" style="width:100%;box-sizing:border-box;height:96px;border:1px solid #C9D0C6;border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;resize:none" placeholder="Temperament, markings, history…"></textarea>
  </div>
  <div style="margin-top:auto;padding:16px 20px 10px;border-top:1px solid #E1E4DC;background:#F4F3EE"><a href="AnimalProfile.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save animal</a></div>
  <div style="text-align:center;font-size:12px;color:#56655B;padding:0 16px 14px">© 2026 Dairy Farm. All rights reserved.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
