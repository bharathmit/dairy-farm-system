<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose farm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.farm{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #DDE1D9;border-radius:14px;padding:16px;text-decoration:none;color:#1C2620;min-height:72px;box-sizing:border-box}
.role{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F4F3EE;display:flex;flex-direction:column;box-sizing:border-box;padding:16px 20px 20px">
  <a href="Main.dc.html" aria-label="Back to login" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-10px;margin-bottom:8px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <div style="width:44px;height:44px;border-radius:12px;background:#1F5C3A;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg>
    </div>
    <div style="font-size:20px;font-weight:700">Dairy Farm</div>
  </div>
  <p style="margin:0;color:#56655B;font-size:14px">Signed in as bharath@…</p>
  <h1 style="margin:6px 0 24px;font-size:26px;font-weight:700">Choose a farm</h1>
  <div style="display:flex;flex-direction:column;gap:12px">
    <a class="farm" href="AnimalList.dc.html" style="border:2px solid #1F5C3A">
      <div style="width:44px;height:44px;border-radius:12px;background:#E7F0E9;color:#1F5C3A;font-weight:700;display:flex;align-items:center;justify-content:center">VD</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:16px">Villupuram Dairy</div>
        <div style="font-size:13px;color:#56655B;margin-top:2px">Villupuram, Tamil Nadu · 20 animals</div>
      </div>
      <span class="role" style="background:#1F5C3A;color:#fff">Owner</span>
    </a>
    <a class="farm" href="AnimalList.dc.html">
      <div style="width:44px;height:44px;border-radius:12px;background:#F3E9D9;color:#7A4B0E;font-weight:700;display:flex;align-items:center;justify-content:center">[F]</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:16px">[Second farm name]</div>
        <div style="font-size:13px;color:#56655B;margin-top:2px">[Location] · [n] animals</div>
      </div>
      <span class="role" style="background:#E4E6DF;color:#3B4A41">Worker</span>
    </a>
  </div>
  <button style="margin-top:16px;height:50px;border-radius:12px;border:1px dashed #A9B3A6;background:transparent;font:inherit;font-weight:600;font-size:15px;color:#1F5C3A;display:flex;align-items:center;justify-content:center;gap:8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a new farm
  </button>
  <p style="margin-top:auto;font-size:13px;color:#56655B;text-align:center;line-height:1.5">Shown only when you belong to more than one farm.<br>Switch any time from the account menu.</p>
  <div style="text-align:center;font-size:12px;color:#56655B;padding:10px 16px 0">© 2026 Dairy Farm. All rights reserved.</div>
</div>
