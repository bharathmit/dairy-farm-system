<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.btn{height:50px;border-radius:12px;border:0;font:inherit;font-weight:600;font-size:16px;background:#1F5C3A;color:#fff;width:100%}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F4F3EE;display:flex;flex-direction:column;position:relative">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="SettingsHome.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;flex:none;margin-right:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg></span>
    <h1 style="margin:0;font-size:20px;font-weight:700">Farm profile</h1>
  </div>
  <div style="padding:8px 20px;display:flex;flex-direction:column;gap:16px">
    <div><label class="lab" for="fn">Farm name *</label><input class="inp" id="fn" value="Villupuram Dairy"></div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <div><label class="lab" for="vi">Village / town</label><input class="inp" id="vi" placeholder="[Village]"></div>
      <div><label class="lab" for="di">District</label><input class="inp" id="di" value="Villupuram"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <div><label class="lab" for="st">State</label><input class="inp" id="st" value="Tamil Nadu"></div>
      <div><label class="lab" for="co">Country</label><input class="inp" id="co" value="India"></div>
    </div>
    <div>
      <span class="lab">Farm location</span>
      <div style="background:#fff;border:1px solid #C9D0C6;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5C3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div style="flex:1"><div style="font-size:15px;font-weight:500">Not set</div><div style="font-size:13px;color:#56655B">Used for weather and heat-stress advice</div></div>
        <button style="height:40px;padding:0 14px;border-radius:10px;border:1px solid #1F5C3A;background:#fff;color:#1F5C3A;font:inherit;font-weight:600;font-size:14px">Use my location</button>
      </div>
    </div>
    <div style="font-size:13px;color:#56655B;line-height:1.5">Currency is fixed to INR (₹). Weights in kg, milk in litres.</div>
  </div>
  <div style="margin-top:auto;padding:16px 20px 10px;background:#F4F3EE;border-top:1px solid #E1E4DC"><button class="btn">Save changes</button></div>
  <div style="text-align:center;font-size:12px;color:#56655B;padding:0 16px 14px">© 2026 Dairy Farm. All rights reserved.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
