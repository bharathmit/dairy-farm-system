<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#56655B;margin:16px 20px 8px}
.grp{background:#fff;border-radius:14px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;border-top:1px solid #EEF0EA;box-sizing:border-box}
.row:first-child{border-top:0}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:#C9D0C6;position:relative;margin:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff}
.sw:checked{background:#1F5C3A}.sw:checked::after{left:23px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.val{font-size:15px;font-weight:600;color:#1F5C3A}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F4F3EE;overflow:hidden;position:relative">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="SettingsHome.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;flex:none;margin-right:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg></span>
    <h1 style="margin:0;font-size:20px;font-weight:700">Notifications</h1>
  </div>
  <div class="grp"><label class="row"><span style="flex:1;font-weight:600;font-size:16px">Enable reminders</span><input class="sw" type="checkbox" role="switch" checked></label></div>

  <div class="sec">What to remind me about</div>
  <div class="grp">
    <label class="row"><span style="flex:1"><span style="display:block;font-size:15px;font-weight:500">Health follow-ups</span><span style="font-size:13px;color:#56655B">Next-action dates, vaccinations, deworming</span></span><input class="sw" type="checkbox" role="switch" checked></label>
    <label class="row"><span style="flex:1"><span style="display:block;font-size:15px;font-weight:500">Breeding &amp; calving</span><span style="font-size:13px;color:#56655B">Heat, pregnancy check, due dates, dry-off</span></span><input class="sw" type="checkbox" role="switch" checked></label>
    <label class="row"><span style="flex:1"><span style="display:block;font-size:15px;font-weight:500">Daily checklist</span><span style="font-size:13px;color:#56655B">Evening nudge for unfinished tasks</span></span><input class="sw" type="checkbox" role="switch" checked></label>
  </div>

  <div class="sec">How early</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 16px">
    <button class="chip">Same day</button><button class="chip on">1 day before</button><button class="chip">3 days</button><button class="chip">7 days</button>
  </div>

  <div class="sec">When</div>
  <div class="grp">
    <div class="row"><span style="flex:1;font-size:15px">Reminder time</span><span class="val">8:00 AM</span></div>
    <label class="row"><span style="flex:1"><span style="display:block;font-size:15px">Morning digest</span><span style="font-size:13px;color:#56655B">One summary of today's tasks</span></span><span class="val" style="margin-right:8px">7:00 AM</span><input class="sw" type="checkbox" role="switch" checked></label>
    <div class="row"><span style="flex:1;font-size:15px">Quiet hours</span><span class="val">10 PM – 5 AM</span></div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#56655B">© 2026 Dairy Farm. All rights reserved.</div>
</div>
</x-dc>

}
</script>
</body>
</html>
