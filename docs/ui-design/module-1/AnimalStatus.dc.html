<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.seg{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));background:#E4E6DF;border-radius:12px;padding:4px}
.sb{height:40px;border:0;border-radius:9px;background:transparent;font:inherit;font-weight:600;font-size:14px;color:#3B4A41}
.on{background:#fff;color:#1C2620}
.act{display:flex;align-items:center;gap:12px;min-height:52px;font-size:15px;font-weight:500;color:#1C2620;text-decoration:none;border:0;background:transparent;font-family:inherit;width:100%;padding:0}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F4F3EE;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background:rgba(20,30,24,.45)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 14px">
    <div style="width:40px;height:4px;border-radius:2px;background:#C9D0C6;margin:0 auto 12px"></div>
    <div style="display:flex;align-items:center;gap:10px"><span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg></span><div style="font-size:13px;color:#56655B">VD-001 · Lakshmi</div></div>
    <div style="border-bottom:1px solid #ECEEE8;margin-bottom:6px">
      <button class="act"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B4A41" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copy tag</button>
      <button class="act"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B4A41" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Move to group</button>
    </div>
    <h2 style="margin:12px 0 12px;font-size:18px;font-weight:700">Change status</h2>
    <div class="seg"><button class="sb on">Sold</button><button class="sb">Dead</button><button class="sb">Transferred</button></div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;margin-top:14px">
      <div><label class="lab" for="ed">Date</label><input class="inp" id="ed" type="date"></div>
      <div><label class="lab" for="ep">Sale price (₹)</label><input class="inp" id="ep" inputmode="decimal" placeholder="0"></div>
    </div>
    <div style="margin-top:14px"><label class="lab" for="er">Reason</label><select class="inp" id="er"><option>Low milk yield (cull)</option><option>Fertility problem (cull)</option><option>Age / replacement</option><option>Male calf sale</option><option>Illness</option><option>Other</option></select></div>
    <div style="margin-top:14px"><label class="lab" for="eb">Buyer</label><input class="inp" id="eb" placeholder="Optional"></div>
    <div style="font-size:13px;color:#56655B;margin-top:10px">A sale adds an income entry in Finance. History stays on the animal.</div>
    <button style="margin-top:16px;height:50px;width:100%;border-radius:12px;border:0;background:#1F5C3A;color:#fff;font:inherit;font-weight:600;font-size:16px">Mark as sold</button>
    <button style="margin-top:8px;height:44px;width:100%;border:0;background:transparent;font:inherit;font-weight:600;font-size:15px;color:#A3271B">Delete animal (owner only)</button>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:6px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
