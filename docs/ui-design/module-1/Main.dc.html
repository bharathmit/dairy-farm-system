<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.btn{height:50px;border-radius:12px;border:0;font:inherit;font-weight:600;font-size:16px;background:#1F5C3A;color:#fff;width:100%}
.btn2{height:50px;border-radius:12px;border:1px solid #C9D0C6;font:inherit;font-weight:600;font-size:16px;background:#fff;color:#1C2620;width:100%}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F4F3EE;display:flex;flex-direction:column;box-sizing:border-box;padding:56px 24px 32px">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:44px;height:44px;border-radius:12px;background:#1F5C3A;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"></path></svg>
    </div>
    <div style="font-size:20px;font-weight:700;flex:1">Dairy Farm</div>
    <a href="CreateAccount.dc.html" style="font-size:14px;font-weight:600;min-height:44px;display:flex;align-items:center;padding:0 4px">Create account</a>
  </div>
  <h1 style="margin:40px 0 6px;font-size:28px;font-weight:700">Welcome back</h1>
  <p style="margin:0 0 28px;color:#56655B;font-size:15px">Sign in to manage your herd.</p>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div><label class="lab" for="em">Email</label><input class="inp" id="em" type="email" placeholder="you@example.com"></div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><label class="lab" for="pw">Password</label><a href="ForgotPassword.dc.html" style="font-size:13px;font-weight:600">Forgot password?</a></div>
      <div style="position:relative">
        <input class="inp" id="pw" type="password" placeholder="••••••••" style="padding-right:52px">
        <button type="button" aria-label="Show password" style="position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#56655B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#3B4A41;min-height:44px"><input type="checkbox" checked="" style="width:20px;height:20px;accent-color:#1F5C3A"> Keep me signed in on this phone</label>
  </div>

  <a href="FarmPicker.dc.html" class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:8px">Sign in</a>
  <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:#56655B;font-size:13px"><div style="flex:1;height:1px;background:#D3D8CF"></div>or<div style="flex:1;height:1px;background:#D3D8CF"></div></div>
  <button class="btn2">Sign in with Google</button>

  <div style="margin-top:auto;text-align:center;font-size:13px;color:#56655B">Workers: ask your farm owner to add you.</div>
  <div style="text-align:center;font-size:12px;color:#56655B;padding:10px 16px 0">© 2026 Dairy Farm. All rights reserved.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
