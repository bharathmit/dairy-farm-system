<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm total and dairy sale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.ln{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#3B4A41}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="MilkHome.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">Farm total &amp; sale</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:8px"><button class="chip on">Milk</button><button class="chip">Manure</button><button class="chip">Other</button></div>
    <div class="two">
      <div><label class="lab" for="dt">Date</label><input class="inp" id="dt" type="date" value="2026-10-21"></div>
      <div><label class="lab" for="ss">Session</label><select class="inp" id="ss"><option>Morning</option><option>Evening</option><option>Whole day</option></select></div>
    </div>
    <div style="background:#E7F0E9;border-radius:12px;padding:12px 14px;font-size:14px;color:#1C3A28;line-height:1.45">Cows logged this morning: <b>78.5 L</b>. Leave litres blank to use that, or type a total if you didn't log each cow.</div>
    <div class="two">
      <div><label class="lab" for="tl">Total litres</label><input class="inp" id="tl" inputmode="decimal" value="78.5"></div>
      <div><label class="lab" for="sl">Sold (L)</label><input class="inp" id="sl" inputmode="decimal" value="72.0"></div>
    </div>
    <div class="two">
      <div><label class="lab" for="by">Sold to</label><input class="inp" id="by" value="[Dairy society]"></div>
      <div><label class="lab" for="rt">Rate ₹/L</label><input class="inp" id="rt" inputmode="decimal" value="38.00"></div>
    </div>
    <div class="two">
      <div><label class="lab" for="fs">Fat % (slip)</label><input class="inp" id="fs" inputmode="decimal" placeholder="4.0"></div>
      <div><label class="lab" for="ns">SNF % (slip)</label><input class="inp" id="ns" inputmode="decimal" placeholder="8.5"></div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:12px 14px">
      <div class="ln"><span>Sold</span><span>72.0 L × ₹38.00</span></div>
      <div class="ln"><span>Calves / home use / discarded</span><span>6.5 L</span></div>
      <div class="ln" style="font-weight:700;color:#1C2620;font-size:16px;border-top:1px solid #EEF0EA;margin-top:4px;padding-top:8px"><span>Income</span><span>₹2,736</span></div>
      <label style="display:flex;align-items:center;gap:10px;font-size:14px;margin-top:8px;min-height:40px"><input type="checkbox" style="width:20px;height:20px;accent-color:#1F5C3A"> Payment received (else marked pending)</label>
    </div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC"><a href="MilkHome.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save &amp; add to Finance</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
