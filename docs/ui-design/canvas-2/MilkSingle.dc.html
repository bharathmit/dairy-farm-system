<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single cow milk log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.card{background:#fff;border-radius:14px;padding:14px}
.stp{height:40px;min-width:52px;border-radius:10px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#1C2620}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
</style>
</helmet>
<div style="width:390px;height:1000px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="MilkHome.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">Milk — one cow</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:14px">
    <div class="two">
      <div><label class="lab" for="cw">Cow *</label><select class="inp" id="cw"><option>VD-002 · Ponni</option></select></div>
      <div><label class="lab" for="dt">Date</label><input class="inp" id="dt" type="date" value="2026-10-21"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Morning</b><span style="font-size:13px;color:#56655B">last 8.0 L</span></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <button class="stp">−1</button><button class="stp">−0.5</button>
        <input aria-label="Morning litres" value="8.0" style="flex:1;min-width:0;height:44px;border:1px solid #C9D0C6;border-radius:10px;text-align:center;font:inherit;font-size:22px;font-weight:700">
        <button class="stp">+0.5</button><button class="stp">+1</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Evening</b><span style="font-size:13px;color:#56655B">last 7.0 L</span></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <button class="stp">−1</button><button class="stp">−0.5</button>
        <input aria-label="Evening litres" placeholder="0.0" style="flex:1;min-width:0;height:44px;border:1px solid #C9D0C6;border-radius:10px;text-align:center;font:inherit;font-size:22px;font-weight:700">
        <button class="stp">+0.5</button><button class="stp">+1</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Milk quality</b><span style="font-size:13px;color:#56655B">optional · grade B</span></div>
      <div class="two" style="margin-top:12px">
        <div><label class="lab" for="ft">Fat %</label><input class="inp" id="ft" inputmode="decimal" value="3.4" style="border-color:#C2410C"><div style="font-size:12px;font-weight:600;color:#9A3412;margin-top:4px">Below 3.5 — price penalty risk</div></div>
        <div><label class="lab" for="sn">SNF %</label><input class="inp" id="sn" inputmode="decimal" value="8.6"></div>
        <div><label class="lab" for="pr">Protein %</label><input class="inp" id="pr" inputmode="decimal" placeholder="3.2"></div>
        <div><label class="lab" for="dn">Density g/mL</label><input class="inp" id="dn" inputmode="decimal" placeholder="1.030"></div>
        <div><label class="lab" for="sc">SCC (k/mL)</label><input class="inp" id="sc" inputmode="numeric" placeholder="weekly"></div>
      </div>
    </div>

    <div><label class="lab" for="nt">Notes</label><input class="inp" id="nt" placeholder="Optional"></div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px"><span>Day total</span><b>8.0 L</b></div>
    <a href="MilkHome.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
