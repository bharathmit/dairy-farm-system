<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Batch treatment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.card{background:#fff;border-radius:14px;padding:14px}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620;white-space:nowrap}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.ck{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-top:1px solid #EEF0EA;font-size:15px}
.ck input{width:20px;height:20px;accent-color:#1F5C3A;margin:0}
.m{font-size:13px;color:#56655B}
</style>
</helmet>
<div root style="width:390px;height:1000px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="HealthHome.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">Batch treatment</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:8px"><button class="chip on">Milking shed A</button><button class="chip">Heifers</button><button class="chip">Calves</button><button class="chip">Pick</button></div>

    <div style="background:#fff;border-radius:14px;overflow:hidden">
      <div style="padding:10px 14px;display:flex;gap:8px;align-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56655B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label for="q" style="position:absolute;left:-9999px">Search animals</label>
        <input id="q" placeholder="Search tag or name" style="flex:1;min-width:0;height:36px;border:0;font:inherit;font-size:15px;outline:none">
      </div>
      <label class="ck" style="background:#E7F0E9;font-weight:600"><input type="checkbox" checked><span style="flex:1">Select all in Milking shed A</span><span class="m" style="color:#1F5C3A">9 of 9</span></label>
      <label class="ck"><input type="checkbox" checked><span style="flex:1"><b>VD-001</b> Lakshmi</span><span class="m">HF</span></label>
      <label class="ck"><input type="checkbox" checked><span style="flex:1"><b>VD-002</b> Ponni</span><span style="font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:#FBF1E2;color:#7A4B0E">in withdrawal</span></label>
      <label class="ck"><input type="checkbox" checked><span style="flex:1"><b>VD-003</b> Kamala</span><span class="m">HF</span></label>
      <label class="ck"><input type="checkbox" checked><span style="flex:1"><b>VD-011</b> Malar</span><span class="m">Jersey</span></label>
      <label class="ck"><input type="checkbox" checked><span style="flex:1"><b>VD-004</b> [name]</span><span class="m">[breed]</span></label>
      <div class="ck" style="justify-content:center"><a href="#" style="font-size:14px;font-weight:600">Show 4 more</a></div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="two">
        <div><label class="lab" for="ty">Type</label><select class="inp" id="ty"><option>Vaccination</option></select></div>
        <div><label class="lab" for="dt">Date</label><input class="inp" id="dt" type="date" value="2026-10-24"></div>
      </div>
      <div><label class="lab" for="md">Medicine (from stock)</label><select class="inp" id="md"><option>FMD vaccine · 12 doses left</option></select></div>
      <div class="two">
        <div><label class="lab" for="ds">Dose / cow</label><input class="inp" id="ds" value="2 ml"></div>
        <div><label class="lab" for="mw">Milk withdrawal</label><input class="inp" id="mw" value="0 days"></div>
      </div>
      <div class="two">
        <div><label class="lab" for="nd">Next action</label><input class="inp" id="nd" type="date" value="2027-04-24"></div>
        <div><label class="lab" for="nn">What</label><input class="inp" id="nn" value="FMD booster"></div>
      </div>
    </div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px"><span>Will create <b>9 records</b></span><span class="m">Cost ₹ [total]</span></div>
    <a href="HealthHome.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save 9 records</a>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:12px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
