<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.card{background:#fff;border-radius:14px;padding:14px}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
.chip{height:40px;padding:0 12px;border-radius:20px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620;white-space:nowrap}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.stp{height:44px;min-width:56px;border-radius:10px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#1C2620}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="Equipment.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">Log service</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:14px">
    <div><label class="lab" for="eq">Equipment *</label><select class="inp" id="eq"><option>Milking machine</option><option>Chaff cutter</option><option>Bulk milk can (40 L) × 4</option><option>Water pump (1 HP)</option></select></div>
    <div style="display:flex;align-items:center;gap:8px;background:#FBE4E1;border-radius:12px;padding:10px 14px;font-size:14px;color:#8E2216"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E2216" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>Was due 15 Oct · 6 days overdue</span></div>

    <div><label class="lab" for="dt">Service date</label><input class="inp" id="dt" type="date" value="2026-10-21"></div>

    <div>
      <span class="lab">Work done</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="chip on">Routine service</button><button class="chip on">Liner change</button><button class="chip">Repair</button><button class="chip">Parts replaced</button></div>
    </div>

    <div class="card">
      <label class="lab" for="cs">Cost (₹)</label>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="stp">−100</button>
        <input id="cs" inputmode="numeric" value="1,800" style="flex:1;min-width:0;height:48px;border:1px solid #C9D0C6;border-radius:10px;text-align:center;font:inherit;font-size:22px;font-weight:700">
        <button class="stp">+100</button>
      </div>
      <div class="two" style="margin-top:12px">
        <div><label class="lab" for="pm">Paid by</label><select class="inp" id="pm"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Cheque</option></select></div>
        <div><label class="lab" for="vd">Mechanic</label><input class="inp" id="vd" value="[Service person]"></div>
      </div>
      <div style="font-size:13px;color:#1F4E87;margin-top:10px">Creates an <b>Equipment</b> expense of ₹1,800</div>
    </div>

    <div><label class="lab" for="nt">Notes</label><input class="inp" id="nt" placeholder="e.g. vacuum pump oil topped up"></div>

    <div class="card" style="display:flex;align-items:center;gap:12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5C3A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="flex:1;font-size:15px">Next service <b>19 Jan 2027</b><span style="display:block;font-size:13px;color:#56655B">auto: every 90 days · reminder 3 days before</span></span>
      <a href="#" style="font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center">Change</a>
    </div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <a href="Equipment.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save service</a>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:12px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
