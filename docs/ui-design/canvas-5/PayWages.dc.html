<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pay wages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.card{background:#fff;border-radius:14px;padding:14px}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
.chip{height:40px;padding:0 12px;border-radius:20px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620;white-space:nowrap}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.ln{display:flex;justify-content:space-between;align-items:center;min-height:38px;border-top:1px solid #EEF0EA;font-size:15px}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="Workers.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">Pay wages</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:14px">
    <div><label class="lab" for="wk">Worker *</label><select class="inp" id="wk"><option>Murugan · daily ₹500</option><option>Selvi · monthly ₹12,000</option></select></div>
    <div class="two">
      <div><label class="lab" for="pf">Period from</label><input class="inp" id="pf" type="date" value="2026-10-12"></div>
      <div><label class="lab" for="pt">Period to</label><input class="inp" id="pt" type="date" value="2026-10-18"></div>
    </div>

    <div class="card">
      <div class="ln" style="border-top:0"><span>Days present <span style="font-size:12px;color:#56655B">from attendance</span></span><b>6</b></div>
      <div class="ln"><span>Half days</span><b>0</b></div>
      <div class="ln"><span>Rate</span><b>₹500 / day</b></div>
      <div class="ln"><span>Advance taken</span><span style="color:#56655B">₹0</span></div>
      <div class="ln" style="border-top:2px solid #1C2620;min-height:48px;font-size:17px"><b>Amount due</b><b>₹3,000</b></div>
    </div>

    <div><label class="lab" for="pa">Amount paid (₹)</label><input class="inp" id="pa" inputmode="numeric" value="3,000" style="font-size:20px;font-weight:700"></div>

    <div>
      <span class="lab">Payment method</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="chip on">Cash</button><button class="chip">UPI</button><button class="chip">Bank transfer</button><button class="chip">Card</button><button class="chip">Cheque</button></div>
    </div>

    <div><label class="lab" for="pd">Paid on</label><input class="inp" id="pd" type="date" value="2026-10-21"></div>

    <div style="display:flex;gap:10px;align-items:flex-start;background:#E6EEF8;border-radius:12px;padding:12px 14px;font-size:14px;color:#1F4E87"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4E87" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Saving creates a <b>Labour</b> expense of ₹3,000 for Murugan, 12–18 Oct, status Paid. The pending entry is closed.</span></div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <a href="Workers.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Mark paid · ₹3,000</a>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:12px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
