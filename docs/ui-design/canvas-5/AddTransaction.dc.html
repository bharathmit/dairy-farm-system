<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.card{background:#fff;border-radius:14px;padding:14px}
.stp{height:44px;min-width:56px;border-radius:10px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#1C2620}
.chip{height:40px;padding:0 12px;border-radius:20px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620;white-space:nowrap}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{flex:1;height:44px;border-radius:9px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;color:#3B4A41}
</style>
</helmet>
<div style="width:390px;height:1250px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="Main.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">Add transaction</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;gap:4px;background:#E4E6DF;border-radius:12px;padding:4px">
      <button class="seg">Income</button>
      <button class="seg" style="background:#fff;color:#A3271B;box-shadow:0 1px 2px rgba(0,0,0,.08)">Expense</button>
    </div>

    <div class="card">
      <label class="lab" for="am">Amount (₹) *</label>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="stp">−100</button>
        <input id="am" inputmode="numeric" value="1,450" style="flex:1;min-width:0;height:48px;border:1px solid #C9D0C6;border-radius:10px;text-align:center;font:inherit;font-size:24px;font-weight:700">
        <button class="stp">+100</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="stp" style="flex:1">+500</button><button class="stp" style="flex:1">+1,000</button><button class="stp" style="flex:1">+5,000</button></div>
    </div>

    <div>
      <span class="lab">Date</span>
      <div class="wrap"><button class="chip on">Today</button><button class="chip">Yesterday</button><input aria-label="Pick date" type="date" class="inp" value="2026-10-21" style="width:160px;height:40px"></div>
    </div>

    <div>
      <span class="lab">Category *</span>
      <div class="wrap">
        <button class="chip on">Feed</button><button class="chip">Labour</button><button class="chip">Vet &amp; medicine</button><button class="chip">Equipment</button><button class="chip">Utilities</button><button class="chip">Semen</button><button class="chip">Transport</button><button class="chip">Animal purchase</button><button class="chip">Other</button>
      </div>
      <div style="font-size:12px;color:#56655B;margin-top:6px">Income shows: Milk sales, Animal sales, Manure, Other</div>
    </div>

    <div>
      <span class="lab">Payment method</span>
      <div class="wrap"><button class="chip">Cash</button><button class="chip on">UPI</button><button class="chip">Bank transfer</button><button class="chip">Card</button><button class="chip">Cheque</button></div>
    </div>

    <div>
      <span class="lab">Status</span>
      <div style="display:flex;gap:4px;background:#E4E6DF;border-radius:12px;padding:4px">
        <button class="seg" style="background:#fff;color:#1F5C3A;box-shadow:0 1px 2px rgba(0,0,0,.08)">Paid</button>
        <button class="seg">Pending</button>
      </div>
    </div>

    <div><label class="lab" for="cp">Counterparty</label><input class="inp" id="cp" value="[Feed supplier name]"></div>

    <div class="card">
      <span class="lab">Allocate to</span>
      <div class="wrap"><button class="chip on">Whole farm</button><button class="chip">Group</button><button class="chip">Animal</button></div>
      <div style="margin-top:12px"><label class="lab" for="al">Animal or group</label><select class="inp" id="al" disabled style="background:#F4F3EE;color:#56655B"><option>Split across all milking cows</option></select></div>
    </div>

    <div><label class="lab" for="nt">Notes</label><input class="inp" id="nt" placeholder="Optional · e.g. bill no."></div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px"><span>Expense · Feed · Paid</span><b style="color:#A3271B">−₹1,450</b></div>
    <a href="Main.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save</a>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:12px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
