<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buy feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.card{background:#fff;border-radius:14px;padding:14px}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
.chip{height:40px;padding:0 12px;border-radius:20px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620;white-space:nowrap}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.hint{font-size:12px;color:#56655B;margin-top:4px}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="Main.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;margin-right:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"/></svg></span>
    <h1 style="margin:0;font-size:20px;font-weight:700">Buy feed</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:14px">
    <div><label class="lab" for="it">Item *</label><select class="inp" id="it"><option>Groundnut cake · 45 kg in stock</option></select></div>
    <div class="two">
      <div><label class="lab" for="qt">Quantity (kg) *</label><input class="inp" id="qt" inputmode="decimal" value="100"></div>
      <div><label class="lab" for="dt">Date</label><input class="inp" id="dt" type="date" value="2026-10-21"></div>
    </div>
    <div class="card">
      <span class="lab">Enter price as</span>
      <div style="display:flex;gap:8px"><button class="chip on">Cost per kg</button><button class="chip">Total amount</button></div>
      <div class="two" style="margin-top:12px">
        <div><label class="lab" for="pk">₹ per kg</label><input class="inp" id="pk" inputmode="decimal" value="[PRICE]"></div>
        <div><label class="lab" for="tt">Total ₹</label><input class="inp" id="tt" value="[TOTAL]" disabled style="background:#F7F7F3"></div>
      </div>
      <div class="hint">Last bought at ₹[LAST PRICE]/kg on 02 Oct.</div>
    </div>
    <div><label class="lab" for="sp">Supplier</label><input class="inp" id="sp" value="[SUPPLIER NAME]"></div>
    <div class="two">
      <div><label class="lab" for="pm">Payment</label><select class="inp" id="pm"><option>UPI</option><option>Cash</option><option>Bank transfer</option></select></div>
      <div><label class="lab" for="ps">Status</label><select class="inp" id="ps"><option>Paid</option><option>Pending</option></select></div>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start;background:#E7F0E9;border-radius:12px;padding:12px 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5C3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <div style="font-size:14px;color:#1C2620"><b>Adds an expense to Finance</b><div style="font-size:13px;color:#3B4A41;margin-top:2px">Category Feed · ₹[TOTAL] · counterparty = supplier. Cost per kg of this item is updated.</div></div>
    </div>
    <div><label class="lab" for="nt">Notes</label><input class="inp" id="nt" placeholder="Bill no., vehicle, etc."></div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px"><span>Stock after purchase</span><b>145 kg</b></div>
    <a href="Main.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save purchase</a>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:12px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
