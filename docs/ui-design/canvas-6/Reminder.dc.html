<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.lab{font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:#1C2620}
.two{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid #C9D0C6;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#1C2620;white-space:nowrap}
.on{background:#1F5C3A;border-color:#1F5C3A;color:#fff}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="AlertsList.dc.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin:0;font-size:20px;font-weight:700">New reminder</h1>
  </div>
  <div style="padding:4px 16px;display:flex;flex-direction:column;gap:14px">
    <div><label class="lab" for="ti">Title *</label><input class="inp" id="ti" value="Vet visit — check Malar's udder"></div>
    <div><label class="lab" for="no">Notes</label><textarea id="no" rows="3" class="inp" style="height:auto;padding:12px 14px;resize:none">Ask Dr [name] to bring CMT kit.</textarea></div>
    <div class="two">
      <div><label class="lab" for="dt">Date</label><input class="inp" id="dt" type="date" value="2026-10-23"></div>
      <div><label class="lab" for="tm">Time</label><input class="inp" id="tm" type="time" value="09:00"></div>
    </div>
    <fieldset style="border:0;margin:0;padding:0">
      <legend class="lab">Type</legend>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="chip">Health</button><button class="chip">Breed</button><button class="chip">Feed</button><button class="chip on">Vet</button><button class="chip">Other</button>
      </div>
    </fieldset>
    <div><label class="lab" for="cw">Cow (optional)</label><select class="inp" id="cw"><option>VD-011 · Malar</option><option>None — whole farm</option></select></div>
    <div style="background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <label for="vw" style="flex:1"><b style="font-size:15px">Visible to workers</b><br><span style="font-size:13px;color:#56655B">Murugan and Selvi see it on their home screen</span></label>
      <span class="sw"><input id="vw" type="checkbox" checked><span aria-hidden="true" style="display:block;width:52px;height:30px;border-radius:15px;background:#1F5C3A;position:relative"><span style="position:absolute;top:3px;left:25px;width:24px;height:24px;border-radius:12px;background:#fff"></span></span></span>
    </div>
    <div style="background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <label for="rp" style="flex:1"><b style="font-size:15px">Repeat</b></label>
      <select id="rp" class="inp" style="width:150px"><option>Does not repeat</option><option>Daily</option><option>Weekly</option><option>Monthly</option></select>
    </div>
  </div>
  <div style="margin-top:auto;padding:14px 16px 24px;border-top:1px solid #E1E4DC;background:#fff">
    <a href="AlertsList.dc.html" style="height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Save reminder</a>
    <div style="text-align:center;font-size:12px;color:#56655B;padding-top:12px">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
