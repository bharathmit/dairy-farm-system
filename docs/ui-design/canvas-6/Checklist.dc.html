<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1C2620}
a{color:#1F5C3A}a:hover{color:#164429}
.card{background:#fff;border-radius:14px;padding:4px 14px}
.it{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid #EEF0EA;cursor:pointer}
.it:first-child{border-top:0}
.cb{width:24px;height:24px;accent-color:#1F5C3A;margin:0;flex:none}
.t{font-size:15px;font-weight:600}.m{font-size:13px;color:#56655B}
.done .t{color:#56655B;text-decoration:line-through}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#56655B;margin:18px 0 8px}
.ib{width:44px;height:44px;border-radius:10px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</helmet>
<div style="width:390px;height:900px;background:#F4F3EE;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:4px;padding:8px 12px">
    <a href="Main.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:#1F5C3A;display:flex;align-items:center;justify-content:center;margin-right:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 3-6 6-10z"/></svg></span>
    <h1 style="margin:0;font-size:22px;font-weight:700;flex:1">Daily checklist</h1>
  </div>

  <div style="padding:4px 16px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px"><span style="color:#56655B">Wed 21 Oct</span><b>4 of 7 done · 3 remaining</b></div>
    <div style="height:8px;border-radius:4px;background:#E4E6DF;margin-top:8px" aria-hidden="true"><div style="width:57%;height:8px;border-radius:4px;background:#1F5C3A"></div></div>

    <div class="sec">Built-in</div>
    <div class="card">
      <label class="it done"><input class="cb" type="checkbox" checked><span style="flex:1"><span class="t">Log morning milk</span><br><span class="m">Murugan · 6:20 AM</span></span></label>
      <label class="it"><input class="cb" type="checkbox"><span style="flex:1"><span class="t">Log evening milk</span><br><span class="m">from 4:30 PM</span></span><a href="#" style="font-size:14px;font-weight:600;text-decoration:none">Open</a></label>
      <label class="it done"><input class="cb" type="checkbox" checked><span style="flex:1"><span class="t">Feed AM</span><br><span class="m">Murugan · 7:05 AM</span></span></label>
      <label class="it"><input class="cb" type="checkbox"><span style="flex:1"><span class="t">Feed PM</span><br><span class="m">due 4:30 PM</span></span></label>
      <label class="it done"><input class="cb" type="checkbox" checked><span style="flex:1"><span class="t">Verify feed stock</span><br><span class="m">Selvi · 9:10 AM · bran low (2 days left)</span></span></label>
      <label class="it done"><input class="cb" type="checkbox" checked><span style="flex:1"><span class="t">Check heat stress</span><br><span class="m">THI 76 · moderate · 2:00 PM</span></span></label>
    </div>

    <div class="sec">Custom</div>
    <div class="card">
      <label class="it"><input class="cb" type="checkbox"><span style="flex:1"><span class="t">Clean water troughs</span><br><span class="m">Daily · visible to workers</span></span><button class="ib" aria-label="Edit task"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56655B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></label>
    </div>

    <a href="#" style="margin-top:12px;height:50px;border-radius:12px;border:1.5px dashed #1F5C3A;color:#1F5C3A;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add custom task</a>

    <div style="background:#fff;border-radius:14px;padding:14px;margin-top:16px">
      <b style="font-size:15px">New custom task</b>
      <div style="margin-top:10px"><label for="ct" style="font-size:13px;font-weight:600;color:#3B4A41;display:block;margin-bottom:6px">Task name *</label><input id="ct" placeholder="e.g. Clean milking cans" style="width:100%;box-sizing:border-box;height:48px;border:1px solid #C9D0C6;border-radius:10px;padding:0 14px;font:inherit;font-size:16px"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <label style="flex:1;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px"><input type="checkbox" checked style="width:22px;height:22px;accent-color:#1F5C3A;margin:0">Repeat daily</label>
        <label style="flex:1;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px"><input type="checkbox" checked style="width:22px;height:22px;accent-color:#1F5C3A;margin:0">Workers see</label>
      </div>
      <a href="#" style="margin-top:8px;height:50px;border-radius:12px;background:#1F5C3A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Add task</a>
    </div>
    <div style="text-align:center;font-size:12px;color:#56655B;padding:16px 0">© 2026 Dairy Farm. All rights reserved.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
